<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123c35">
<title>مقالات حقوقی | مجید خاتمی</title>
<meta name="description" content="بخش مقالات حقوقی مجید خاتمی.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
:root{--green:#123c35;--green2:#1c6555;--cream:#f7f5ef;--line:#e8e4d9;--muted:#687772}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#172b27;font-family:Vazirmatn,Tahoma,sans-serif;line-height:2}
header{background:#fff;border-bottom:1px solid var(--line)}.container{width:min(100% - 32px,1050px);margin:auto}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{color:var(--green);font-weight:800;text-decoration:none}.back{color:var(--green2);text-decoration:none;font-weight:600}
main{min-height:65vh;padding:64px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 8px 25px #243b3010}
h1{color:var(--green);margin:0 0 10px;font-size:2rem}.muted{color:var(--muted);margin:0}
footer{background:#102f29;color:#dce7e1;text-align:center;padding:24px 12px;font-size:.85rem}
@media(max-width:600px){main{padding:38px 0}.panel{padding:22px}h1{font-size:1.6rem}.nav{min-height:62px}}
</style>
</head>
<body>
<header><div class="container nav"><a class="brand" href="index.html">مجید خاتمی</a><a class="back" href="index.html">بازگشت به صفحه اصلی</a></div></header>
<main><div class="container"><section class="panel"><h1>مقالات</h1><p class="muted">مقالات حقوقی در این بخش قرار می‌گیرند.</p></section></div></main>
<footer>مجید خاتمی • شهرضا</footer>
